phase: late_flower
light_hours_per_day: 12
LAI: 4.0

day:
  VPD_target: 1.3
  T_target: 24.0
  CO2_target: 900.0
  dryback_rate_target: 0.001
  theta_target: 0.28
  theta_target_frac: 0.60
  RH_target: 56.0

night:
  VPD_target: 0.95
  T_target: 18.0
  CO2_target: 600.0
  dryback_rate_target: 0.003
  theta_target: 0.25
  theta_target_frac: 0.50
  RH_target: 54.0

ramp_minutes: 60

compliance:
  VPD_tolerance: 0.15
  T_tolerance: 1.5
  CO2_tolerance: 125.0
  theta_tolerance: 0.05
  RH_tolerance: 6.0

weights:
  Q:
    VPD: 60.0
    T: 15.0
    CO2: 0.8
    dryback: 4.0
    theta: 3.0
    RH: 2.0              # near-zero — VPD drives humidity via T_leaf
  R:
    T_sp: 0.1
    RH_sp: 0.1
    u_cool: 0.003
    u_heat: 0.01
    u_dehum: 0.003       # allow aggressive dehumidification
    u_hum: 0.01
    u_co2: 0.005
    u_fan: 0.003
    u_irr: 0.02
  S:
    T_sp: 0.5
    RH_sp: 0.5
    u_cool: 0.1
    u_heat: 0.5
    u_dehum: 0.15        # faster dehum response
    u_hum: 0.2
    u_co2: 0.05
    u_fan: 0.1
    u_irr: 0.3

irrigation_schedule:
  enabled: true
  first_shot_delay_min: 30
  last_shot_cutoff_min: 240
  min_interval_min: 60
  theta_trigger_fraction: 0.10
  shot_duration_s: 12
  max_daily_shots: 10
  drain_settle_min: 5
