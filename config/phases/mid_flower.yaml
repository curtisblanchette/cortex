phase: mid_flower
light_hours_per_day: 12

day:
  VPD_target: 1.2
  T_target: 26.0
  CO2_target: 1200.0
  dryback_rate_target: 0.0
  theta_target: 0.35
  RH_target: 60.0

night:
  VPD_target: 1.0
  T_target: 22.0
  CO2_target: 800.0
  dryback_rate_target: 0.002
  theta_target: 0.30
  RH_target: 62.0

ramp_minutes: 60

compliance:
  VPD_tolerance: 0.15
  T_tolerance: 1.0
  CO2_tolerance: 100.0
  theta_tolerance: 0.05
  RH_tolerance: 5.0

weights:
  Q:  # State tracking weights
    VPD: 10.0
    T: 50.0             # doubled - T is most off-target
    CO2: 1.0
    dryback: 3.0
    theta: 2.0
    RH: 5.0
  R:  # Control effort - low for percentage controls
    T_sp: 0.1
    RH_sp: 0.1
    u_cool: 0.005
    u_heat: 0.01
    u_dehum: 0.005
    u_hum: 0.005
    u_co2: 0.003
    u_fan: 0.003
    u_irr: 0.01
  S:  # Rate-of-change - moderate to dampen oscillation
    T_sp: 1.0
    RH_sp: 1.0
    u_cool: 0.1           # allow faster cooling response
    u_heat: 0.5
    u_dehum: 0.2
    u_hum: 0.1
    u_co2: 0.05
    u_fan: 0.1
    u_irr: 0.2
