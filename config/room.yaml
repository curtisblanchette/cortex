room:
  volume_m3: 280.0          # 10m x 7m x 4m
  floor_area_m2: 70.0       # 10m x 7m
  canopy_area_m2: 56.0      # ~80% of floor
  wall_area_m2: 136.0       # total interior wall surface

  # Initial parameter estimates (SLSQP will tune these)
  initial_params:
    UA_wall: 50.0            # W/K - wall thermal conductance
    UA_env: 25.0             # W/K - envelope conductance to outdoors
    tau_hvac: 120.0          # s - HVAC time constant
    g_s_max: 0.4             # mol/m²/s - max stomatal conductance
    LAI: 3.0                 # m²/m² - leaf area index
    K_drain: 0.05            # 1/hr - drainage coefficient
    C_wall: 500000.0         # J/K - thermal mass capacitance
    eta_hvac: 0.85           # - HVAC efficiency

  # Air exchange
  # Passive infiltration from door gaps, duct seals, penetrations.
  ach_infiltration: 0.1     # air changes per hour
  # Active exhaust through carbon filters for odor control.
  # Exhausted room air is replaced by outdoor air (makeup through HVACD
  # damper or passive intake). Dilutes enriched CO2 toward ambient 420 ppm.
  # Typical: 0.5-1.0 (small sealed), 1.0-2.0 (commercial with scrubbers).
  ach_exhaust: 1.0          # air changes per hour

  # Air properties
  rho_air: 1.2              # kg/m³
  cp_air: 1005.0            # J/(kg·K)

  # Light schedule
  light_schedule:
    on_hour: 6.0
    off_hour: 18.0
  light_power_W: 18700.0    # total lighting power (56m² canopy × 900 PPFD ÷ 2.7 PPE)
  par_efficiency: 0.4        # fraction of light power that is PAR (rest is heat)

  # Outdoor conditions (defaults)
  # TODO supply these values from weather apis using users locale.
  outdoor:
    T_out_mean_C: 28.0
    T_out_amplitude_C: 5.0
    w_out_gkg: 12.0

  # Plant defaults
  N_plants: 100
  phase: mid_flower

  # Reference-bias integral action (compensates for slow unmodeled dynamics).
  #
  # The MPC's prediction horizon (Np × step_s ≈ 1800 s) is shorter than the
  # wall thermal time constant (C_wall / UA_wall ≈ 10,000 s), and the outdoor
  # weather forecast is persistence-based, so persistent biases that the QP
  # cannot resolve in-horizon are absorbed here. This is *not* a linearization
  # patch — see docs/decisions-recent.md "Integral action diagnosis".
  #
  # Tune per room: smaller rooms have shorter wall τ and need lower gain;
  # larger rooms or sites with strong outdoor coupling may need higher clamps.
  integral_action:
    gain: 0.003                 # 1/s, per unit error
    t_clamp_C: 4.0              # ±°C cap on temperature reference bias
    vpd_clamp_kPa: 0.3          # ±kPa cap on VPD reference bias
    saturation_warn_s: 300      # advisory fires after this long pegged at clamp
